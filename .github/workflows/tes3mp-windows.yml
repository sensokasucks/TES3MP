name: TES3MP Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - 'port/**'

env:
  BUILD_TYPE: RelWithDebInfo
  MSVC: "2022"

jobs:
  Windows:
    name: tes3mp-windows-2022

    runs-on: windows-2022

    permissions:
      contents: write

    env:
      archive: FAILEDTODOWNLOAD

    steps:
    - uses: actions/checkout@v6

    - shell: bash
      name: Add deps version env to GITHUB_ENV, stripping comments
      run: |
        sed '/^\s*#/d; /^\s*$/d' "${{ github.workspace }}/CI/deps_versions.msvc.sh" >> $GITHUB_ENV

    - name: Create directories for dependencies
      run: |
        mkdir -p ${{ github.workspace }}/deps
        mkdir -p ${{ github.workspace }}/deps/Qt

    - name: Download prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}-manifest.txt"
        curl --fail --retry 3 -L -o "$MANIFEST" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$MANIFEST"
        $lines = Get-Content "$MANIFEST"
        $URL = $lines[0]
        $split = -split $lines[1]
        $HASH = $split[0]
        $FILE = $split[1]
        curl --fail --retry 3 -L -o "$FILE" "$URL"
        $filehash = Get-FileHash "$FILE" -Algorithm SHA512
        if ( $filehash.hash -ne "$HASH" ) {
          exit 1
        }
        echo "archive=$FILE" >> $env:GITHUB_ENV

    - name: Extract archived prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: 7z x -y -ovcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }} $env:archive

    - name: Cache Qt
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1

    - name: Download aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        curl --fail --retry 3 -L
        -o aqt_x64.exe
        https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe

    - name: Install Qt with aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: .\aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Checkout CrabNet
      uses: actions/checkout@v6
      with:
        repository: TES3MP/CrabNet
        path: deps/CrabNet-src

    - name: Build and install CrabNet
      run: >
        cmake -S ${{ github.workspace }}/deps/CrabNet-src -B ${{ github.workspace }}/deps/CrabNet-build -G Ninja
        -D CMAKE_BUILD_TYPE=Release
        -D CRABNET_ENABLE_DLL=OFF
        -D CRABNET_ENABLE_SAMPLES=OFF
        -D CRABNET_ENABLE_STATIC=ON
        -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/deps/CrabNet
        && cmake --build ${{ github.workspace }}/deps/CrabNet-build
        && cmake --install ${{ github.workspace }}/deps/CrabNet-build
        && cp ${{ github.workspace }}/deps/CrabNet/lib/RakNetLibStatic.lib ${{ github.workspace }}/deps/CrabNet/lib/RakNetLibStaticd.lib

    - name: Configure TES3MP
      shell: bash
      run: |
        WS=$(cygpath -m "$GITHUB_WORKSPACE")
        VCPKG="$WS/deps/vcpkg-x64-windows-${MSVC}-${VCPKG_TAG}"
        export RAKNET_ROOT="$WS/deps/CrabNet"
        mkdir -p build
        cmake -S . -B "$WS/build" -G Ninja \
          -D CMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -D CMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake" \
          -D CMAKE_PREFIX_PATH="$WS/deps/Qt/${QT_VER}/msvc2019_64" \
          -D LuaJit_INCLUDE_DIR="$VCPKG/installed/x64-windows/include/luajit" \
          -D LuaJit_LIBRARY="$VCPKG/installed/x64-windows/lib/lua51.lib" \
          -D RakNet_INCLUDES="$WS/deps/CrabNet/include" \
          -D RakNet_LIBRARY_RELEASE="$WS/deps/CrabNet/lib/RakNetLibStatic.lib" \
          -D RakNet_LIBRARY_DEBUG="$WS/deps/CrabNet/lib/RakNetLibStaticd.lib" \
          -D BUILD_OPENMW=ON \
          -D BUILD_OPENMW_MP=ON \
          -D BUILD_BROWSER=OFF \
          -D BUILD_LAUNCHER=ON \
          -D BUILD_WIZARD=ON \
          -D BUILD_MWINIIMPORTER=ON \
          -D BUILD_ESSIMPORTER=ON \
          -D BUILD_BSATOOL=ON \
          -D BUILD_ESMTOOL=ON \
          -D BUILD_NIFTEST=OFF \
          -D BUILD_NAVMESHTOOL=ON \
          -D BUILD_BULLETOBJECTTOOL=ON \
          -D BUILD_OPENCS=OFF \
          -D BUILD_BENCHMARKS=OFF \
          -D BUILD_COMPONENTS_TESTS=OFF \
          -D BUILD_OPENMW_TESTS=OFF \
          -D BUILD_OPENCS_TESTS=OFF \
          -D OPENMW_USE_SYSTEM_SQLITE3=OFF \
          -D OPENMW_USE_SYSTEM_YAML_CPP=OFF \
          -D OPENMW_LTO_BUILD=OFF \
          2>&1 | tee build/configure.log; exit ${PIPESTATUS[0]}

    - name: Build TES3MP
      shell: bash
      run: cmake --build build -- -k 0 2>&1 | tee build/build.log; exit ${PIPESTATUS[0]}

    - name: Post error excerpt as a commit comment
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "Windows build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo '```'
          for f in build/configure.log build/build.log; do
            if [ -f "$f" ]; then
              echo "== $f =="
              grep -n -E "CMake Error|CMake Warning|error C[0-9]+|error LNK[0-9]+|fatal error|FAILED:|Could NOT|Could not|not found|NOTFOUND" "$f" | head -400
              echo "-- tail --"
              tail -n 60 "$f"
            fi
          done
          echo '```'
        } | head -c 60000 > excerpt.txt
        jq -Rs '{body: .}' excerpt.txt | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - > /dev/null

    - name: Copy missing DLLs
      run: |
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/Release/MyGUIEngine.dll ${{ github.workspace }}/build
        cp -Filter *.dll -Recurse ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/osgPlugins-3.6.5 ${{ github.workspace }}/build
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ env.MSVC }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/*.dll ${{ github.workspace }}/build

    - name: Copy Qt DLLs
      working-directory: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
      run: |
        cp bin/Qt6Core.dll ${{ github.workspace }}/build
        cp bin/Qt6Gui.dll ${{ github.workspace }}/build
        cp bin/Qt6Network.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGL.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGLWidgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Widgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Svg.dll ${{ github.workspace }}/build
        mkdir ${{ github.workspace }}/build/styles
        cp plugins/styles/qwindowsvistastyle.dll ${{ github.workspace }}/build/styles
        mkdir ${{ github.workspace }}/build/platforms
        cp plugins/platforms/qwindows.dll ${{ github.workspace }}/build/platforms
        mkdir ${{ github.workspace }}/build/imageformats
        cp plugins/imageformats/qsvg.dll ${{ github.workspace }}/build/imageformats
        mkdir ${{ github.workspace }}/build/iconengines
        cp plugins/iconengines/qsvgicon.dll ${{ github.workspace }}/build/iconengines

    - name: Move pdb files
      run: |
        robocopy build pdb *.pdb /MOVE
        if ($lastexitcode -lt 8) {
          $global:LASTEXITCODE = $null
        }

    - name: Install TES3MP
      run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/install

    - name: Remove extra files
      shell: bash
      run: |
        rm -rf install/bin
        rm -rf install/_deps
        printf "Ref ${{ github.ref }}\nCommit ${{ github.sha }}\nRun ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n" > install/CI-ID.txt

    - name: Store TES3MP build
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-windows-${{ env.MSVC }}-${{ github.sha }}
        path: ${{ github.workspace }}/install/*

    - name: Store pdb files
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-windows-${{ env.MSVC }}-pdb-${{ github.sha }}
        path: ${{ github.workspace }}/pdb/*

    - name: Store logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-windows-${{ env.MSVC }}-logs-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/**/*.log
          ${{ github.workspace }}/build/**/*.ninja_log
          ${{ github.workspace }}/build/**/CMakeCache.txt
